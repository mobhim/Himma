<style>
:root{--olive-deep:#2f3620;--silk:#efe6d2;--silk-dim:rgba(239,230,210,.75);--font-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;--font-sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-sans);color:var(--silk);background:#2f3620;
  background:radial-gradient(70% 45% at 60% 0%,rgba(244,234,204,.18),transparent 70%),linear-gradient(160deg,#5d6a3a 0%,#46502b 45%,#262c18 100%) fixed;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><g fill='none' stroke='%23efe6d2' stroke-width='1'><rect x='24' y='24' width='36' height='36'/><rect x='24' y='24' width='36' height='36' transform='rotate(45 42 42)'/><circle cx='42' cy='42' r='6'/></g></svg>");
  -webkit-mask-image:radial-gradient(ellipse at 50% 15%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 15%,#000 10%,transparent 70%)}
.wrap{position:relative;max-width:860px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;color:var(--silk-dim);text-decoration:none;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,248,225,.25);background:rgba(255,255,255,.05);transition:background .2s,color .2s}
.back:hover{background:rgba(255,255,255,.1);color:#fff}
.back svg{width:16px;height:16px}
.logo{width:min(260px,60vw);height:auto;filter:drop-shadow(0 10px 24px rgba(20,24,12,.55));margin-top:6px}
h1{margin:4px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(32px,6vw,52px);line-height:1.2;color:#f6efdc;text-align:center}
.lead{margin:0;max-width:34rem;text-align:center;font-size:clamp(15px,2.2vw,18px);line-height:1.8;color:var(--silk-dim)}
.card{width:100%;margin-top:10px;padding:10px;border-radius:28px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,248,225,.32);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 30px 60px -24px rgba(10,12,6,.65)}
.card iframe{display:block;width:100%;height:max(1100px,80vh);border:0;border-radius:20px;background:#fff}
.alt{font-size:13px;color:var(--silk-dim);text-align:center}
.alt a{color:var(--silk)}
@media (max-width:620px){.card{padding:6px;border-radius:22px}.card iframe{height:1300px;border-radius:16px}}
</style>
</head>
