<title>ميزان · نادي همة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the whole page is the game — a plum "editor" frame (timeline on top, tool rail at the side, progress at the bottom) around one full-height pink stage where every screen plays. Deliberately single theme. */
:root{
  color-scheme:light;
  --paper:#FFF0F5; --paper-2:#FCE0EB; --white:#FFFFFF; --ink:#2B0F1E; --muted:#8A5C70; --line:#F2CCDB;
  --pink:#E8337F; --pink-deep:#B0145A; --pink-soft:#FFE1EE; --circle:#1F7BE0; --red:#FF2E63; --lime:#93E23F; --lime-ink:#1E3A05;
  --frame:#26101C; --frame-2:#361827; --frame-3:#4A2338; --frame-ink:#FDEAF2; --frame-muted:#C095AA;
  --bg-one:#FFF4F8;
  --f-display:"Readex Pro",Tahoma,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg-one);color:var(--ink)}
body{font-family:var(--f-display);font-size:16px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
h1,h2,h3,p{margin:0}

#app{height:100%;display:grid;grid-template-rows:1fr auto;gap:0;padding-block:0;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* top bar */
.himma-top{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--frame-muted);font-size:.8rem;min-width:0}
.himma-img{height:44px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.himma-ink{width:min(190px,48vw);aspect-ratio:427/254;background:var(--pink-deep);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.himma-ink.sm{width:120px}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:"Aref Ruqaa",serif;font-size:1.6rem;line-height:1;background:var(--frame-2);border-radius:14px;padding:6px 14px 8px;height:44px}
.brand svg{width:24px;height:24px}
.brand i{color:var(--pink);font-style:normal}
.tl{display:grid;grid-template-columns:44px 1fr 60px;gap:8px;align-items:center;min-width:0}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--frame-2);display:grid;place-items:center;transition:background .2s,transform .15s}
.ibtn:hover{background:var(--frame-3)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:18px;height:18px}
.ibtn[aria-current="true"],.ibtn[aria-pressed="true"]{background:var(--pink);color:#fff}
.ruler{position:relative;height:44px;border-radius:14px;background:var(--frame-2);overflow:hidden;direction:rtl;min-width:0}
.ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 12px;align-items:flex-end;font-family:var(--f-mono);font-size:.66rem;color:var(--frame-muted)}
.ticks i{font-style:normal;display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:5px}
.ticks i::before{content:"";width:1px;height:9px;background:var(--frame-3)}
.fill{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,rgba(255,46,99,0),rgba(255,46,99,.25))}
.head{position:absolute;top:0;bottom:0;width:2px;background:var(--red);right:12px}
.head b{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:5px;white-space:nowrap}
.head.urgent b{animation:beat .5s infinite alternate}
@keyframes beat{to{transform:translateX(-50%) scale(1.25)}}
.ttime{font-family:var(--f-mono);font-size:.9rem;color:var(--frame-muted);text-align:center}
.ttime.hot{color:var(--red)}
.right{display:flex;gap:8px;align-items:center}
.scorepill{height:44px;display:flex;align-items:center;gap:10px;background:var(--frame-2);border-radius:14px;padding:0 14px;border:1.5px solid var(--pink)}
.scorepill span{font-size:.8rem;color:var(--frame-muted)}
.scorepill b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;display:inline-block}
.streak{height:44px;display:flex;align-items:center;gap:6px;border-radius:14px;padding:0 12px;background:linear-gradient(135deg,#FF7AB0,#E8337F);color:#fff;font-weight:600;font-size:.85rem;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.streak.on{transform:scale(1)}

.body{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;gap:8px}

/* stage */
.stage{position:relative;overflow:hidden;min-height:0;color:var(--ink);background:transparent}
.stage::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,46,99,0);transition:box-shadow .3s}
.stage.alarm::after{animation:alarm .5s infinite alternate}
@keyframes alarm{to{box-shadow:inset 0 0 0 6px rgba(255,46,99,.55)}}
.stage.flash::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(147,226,63,.35),transparent 60%);z-index:4;pointer-events:none;animation:fl .7s forwards}
@keyframes fl{to{opacity:0}}
#bg,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:6}
.deco{position:absolute;pointer-events:none;z-index:1}
.deco.r.corner{top:14px;right:18px;width:90px;opacity:.95;z-index:3}
.deco.l{bottom:-36px;left:-18px;width:120px;transform:rotate(18deg)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:2;display:flex;flex-direction:column;padding:18px clamp(14px,3vw,40px) 22px}
.s-title{align-self:center;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 34px;font-weight:600;box-shadow:0 10px 24px -16px rgba(176,20,90,.5);animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding-block:14px}
.anim{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* intro */
.hang{width:100%;max-width:880px;height:clamp(150px,24vh,260px);touch-action:pan-y}
.hang svg{width:100%;height:100%;overflow:visible}
.hang .obj{cursor:grab}
.title{font-weight:600;font-size:clamp(2.6rem,min(9vw,10vh),6.4rem);line-height:1;text-align:center;display:flex;flex-wrap:wrap;gap:.25em;justify-content:center}
.title span{display:inline-block;cursor:default;transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .3s;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.title span:nth-child(2){color:var(--pink);animation-delay:.15s}
.title span:hover{transform:translateY(-10px) rotate(-3deg) scale(1.05);color:var(--circle)}
@keyframes rise{from{opacity:0;transform:translateY(50px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.lead{color:var(--muted);text-align:center;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:14px 26px;font-weight:600;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px -14px rgba(43,15,30,.7)}
.btn.pink{background:var(--pink)}
.ghost{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:14px 22px;font-weight:500;transition:border-color .2s,transform .2s}
.ghost:hover{border-color:var(--ink);transform:translateY(-2px)}
.credit{font-size:.85rem;color:var(--muted)}
.credit b{color:var(--ink)}
.credit.big{font-size:clamp(1.05rem,2vw,1.35rem);font-weight:500;color:var(--pink-deep);margin-bottom:-6px}
.credit.big b{color:var(--pink-deep);font-weight:700}
.keys{font-size:.75rem;color:var(--muted);text-align:center}
.keys kbd{font-family:var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 6px}

/* rules */
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;max-width:640px;width:100%}
.rules li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:transform .25s,border-color .25s}
.rules li:hover{transform:translateX(-8px);border-color:var(--pink)}
.rules b{font-family:var(--f-mono);width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:.85rem}

/* menu */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:860px;perspective:800px}
@media (max-width:760px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{position:relative;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .2s,box-shadow .3s;transform-style:preserve-3d}
.cat:hover{box-shadow:0 26px 36px -24px rgba(232,51,127,.8)}
.cat .ring{position:relative;width:78px;height:78px}
.cat .ring svg{position:absolute;inset:0;width:100%;height:100%}
.cat .ring .rb{position:absolute;inset:18px 10px;width:auto;height:auto;aspect-ratio:auto;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.cat:hover .ring .rb{transform:rotate(-14deg) scale(1.15)}
.cat .t{font-weight:600}
.cat .c{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.linkbtn{font-size:.85rem;color:var(--muted);text-decoration:underline;text-underline-offset:4px}

/* number grid */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,2vw,22px);width:100%;max-width:620px}
@media (max-width:480px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.num{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:clamp(1.3rem,3vw,1.9rem);color:var(--pink-deep);background:radial-gradient(circle at 35% 28%,#fff 0 18%,transparent 19%),radial-gradient(circle at 50% 50%,#fff 0 58%,transparent 59%),conic-gradient(from 200deg,#FFB3D1,#E8337F,#B0145A,#FF79AE,#FFD6E7,#FFB3D1);box-shadow:0 12px 20px -12px rgba(176,20,90,.7),inset 0 -3px 6px rgba(176,20,90,.25);transition:translate .25s ease-out,scale .2s}
.num:hover:not(:disabled){scale:1.08}
.num .rb{position:absolute;width:30%;bottom:-4%;right:-4%}
.num:disabled{cursor:default;color:#C9B3BD;filter:grayscale(1);opacity:.5}
.num:disabled::after{content:"✓";position:absolute;top:-4px;left:-4px;width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-size:.8rem;display:grid;place-items:center}

/* question */
.q{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,250px);gap:20px;align-items:center;width:100%;max-width:940px;perspective:900px}
@media (max-width:760px){.q{grid-template-columns:1fr;justify-items:center}}
.q .num{width:78px;cursor:default}
.qcard{position:relative;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:30px 26px;min-height:170px;display:grid;place-items:center;text-align:center;box-shadow:0 30px 50px -36px rgba(176,20,90,.6);width:100%;transition:transform .15s ease-out}
.qcard .txt{font-weight:500;font-size:clamp(1.15rem,2.4vw,1.6rem);line-height:1.55;text-wrap:balance}
.qcard .rbg{position:absolute;top:-34px;right:-14px;width:70px}
.letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letter{width:56px;height:62px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:1.7rem;font-weight:600;box-shadow:inset 0 -4px 0 var(--paper-2);cursor:pointer;transition:transform .2s,background .2s;user-select:none}
.letter:hover{transform:translateY(-4px) rotate(-4deg)}
.letter.picked{background:var(--pink);color:#fff;box-shadow:inset 0 -4px 0 var(--pink-deep);transform:translateY(-6px)}
.attempt{min-height:46px;font-size:1.6rem;font-weight:600;color:var(--pink-deep);letter-spacing:0}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
.answer-word{font-weight:700;font-size:2.6rem;color:var(--pink)}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{position:relative;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:12px 20px 12px 44px;text-align:start;font-weight:500;transition:background .15s,border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--pink);transform:translateX(-4px)}
.opt kbd{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.opt:disabled{cursor:default}
.opt.right{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);animation:glow .8s}
.opt.wrong{background:#FFE1DE;border-color:var(--red);color:#8A1610}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(147,226,63,.8)}100%{box-shadow:0 0 0 18px rgba(147,226,63,0)}}
.qfoot{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:900px}
.reveal{width:54px;height:54px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--pink);box-shadow:0 10px 20px -12px rgba(176,20,90,.6);animation:breathe 2s ease-in-out infinite}
.reveal svg{width:24px;height:24px}
@keyframes breathe{50%{scale:1.1}}
.explain{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:16px;padding:12px 18px;max-width:680px;text-align:center;font-size:.95rem}
.explain b{display:block;margin-bottom:2px}
.timeout{color:var(--red)}
.judge{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.judge button{border-radius:999px;padding:10px 18px;font-weight:600;border:1px solid var(--line);background:var(--white)}
.judge .yes{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.back{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;background:var(--ink);color:#fff;font-weight:500;transition:transform .2s}
.back:hover{transform:translateY(-2px)}
.back svg{width:16px;height:16px}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}

/* end */
.end{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;min-width:0}
.end h2{font-weight:600;font-size:clamp(1.8rem,5vw,3.2rem);text-align:center;line-height:1.15}
.final{display:flex;gap:10px;justify-content:center;width:100%}
.final div{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;min-width:0;flex:1 1 0;max-width:170px}
.final strong{display:block;font-family:var(--f-mono);font-size:2rem}
.big14{font-weight:700;font-size:clamp(3.4rem,10vw,6rem);line-height:1;color:var(--pink);text-align:center}

/* logo hero */
.logo-hero{position:relative;width:110px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer}
.logo-hero svg{width:80%;height:100%;position:relative;animation:floaty 3s ease-in-out infinite}
.logo-hero:hover svg{animation-duration:1s}
.pulse{position:absolute;inset:0;border-radius:50%;border:3px solid var(--circle);animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.7);opacity:.7}to{transform:scale(1.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.floaty{animation:floaty 3.5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.spin{animation:spin 8s linear infinite}
.pop-in{animation:popin .55s cubic-bezier(.3,1.6,.5,1) both}
.pop-in{animation-fill-mode:backwards}
@keyframes popin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.slide-in{animation:slidein .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.7)}}

/* bottom */
.side{min-width:0;display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-inline-end:1px solid var(--line);min-height:0;overflow-y:auto}
.side .brand{background:none;height:auto;border-radius:0;display:flex;align-items:center;gap:8px;font-family:"Aref Ruqaa",serif;font-size:1.7rem;line-height:1;color:var(--ink);padding:4px 8px 8px}
.side .brand svg{width:24px;height:31px}
.side .brand i{color:var(--pink);font-style:normal}
.sections{display:flex;flex-direction:column;gap:4px}
.sec-label{font-size:.72rem;letter-spacing:.06em;color:var(--muted);padding:10px 10px 2px}
.sec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-align:start;font-weight:500;color:var(--ink);transition:background .2s,transform .2s,color .2s}
.sec svg{width:18px;height:18px;flex:none;color:var(--pink)}
.sec span:not(.dotn){flex:1;min-width:0}
.sec small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.sec .dotn{width:22px;height:22px;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.sec:hover{background:var(--pink-soft);transform:translateX(-3px)}
.sec[aria-current="true"]{background:var(--pink);color:#fff}
.sec[aria-current="true"] svg,.sec[aria-current="true"] small{color:#fff}
.sec[aria-current="true"] .dotn{background:#fff;color:var(--pink)}
.side-foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.side .scorepill{flex:1;background:var(--white);color:var(--ink);border:1.5px solid var(--pink)}
.side .scorepill span{color:var(--muted)}
.side .ibtn{background:var(--white);border:1px solid var(--line);color:var(--pink)}
.side .ibtn:hover{background:var(--pink-soft)}
.side .streak{order:3;flex-basis:100%;justify-content:center;height:36px;display:none}
.side .streak.on{display:flex}
.intro-logo{width:110px;margin-top:6px}
.bottom{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.prog{display:flex;flex-direction:column;gap:6px;min-width:0}
.ptop{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.track{height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF9CC4,#E8337F);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.copy{font-size:.78rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:10px}
.copy .foot-logo{width:56px;flex:none}
.site{color:var(--pink-deep);font-size:.8rem;font-weight:600;text-decoration:underline;text-underline-offset:3px;display:inline-block}
.site span{font-family:var(--f-mono);font-weight:500}
.site-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:600;color:var(--pink-deep);text-decoration:none;transition:border-color .2s,transform .2s}
.site-btn:hover{border-color:var(--pink);transform:translateY(-2px)}
.site-btn span{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.site:hover{color:var(--pink)}
.copy b{color:var(--ink)}

@media (max-width:760px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .body{grid-template-columns:minmax(0,1fr)}
  .sections{min-width:0}
  .side{border-inline-end:0;border-bottom:1px solid var(--line);padding:12px 12px 10px;gap:10px;overflow:visible}
  .sections{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .sections::-webkit-scrollbar{display:none}
  .sec{white-space:nowrap;flex:none;background:var(--white);border:1px solid var(--line);padding:8px 12px}
  .sec-label{display:none}
  .side .brand{display:none}
  .side-foot{margin-top:0;flex-wrap:nowrap}
  .side .streak{flex-basis:auto;order:0}
  .stage{min-height:calc(100svh - 200px)}
  .scroller{position:relative;inset:auto;min-height:inherit}
  .bottom{grid-template-columns:1fr}
  .copy{white-space:normal;text-align:center;justify-content:center}

function tone(f, d, type, g, when, f2){
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + (when || 0), o = ac.createOscillator(), v = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    v.gain.setValueAtTime(g || .07, t); v.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch(e) {}
}

/* ---------- confetti ---------- */
const fx = $('#fx'), fxx = fx.getContext('2d'); let parts = [], fxRun = false;
function sizeCanvas(c){ const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d; c.getContext('2d').setTransform(d,0,0,d,0,0); return r; }
function burst(x, y, n){
  if (reduce) return;
  const r = stage.getBoundingClientRect();
  if (x == null){ x = r.width / 2; y = r.height / 2; }
  const cols = ['#E8337F','#FF9CC4','#1F7BE0','#93E23F','#FFD6E7','#B0145A'];
  for (let i = 0; i < (n || 90); i++) parts.push({x, y, vx:(Math.random()-.5)*13, vy:Math.random()*-12-3, s:Math.random()*7+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, va:(Math.random()-.5)*.4, ring:false, life:120});
  if (!fxRun){ fxRun = true; sizeCanvas(fx); requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const r = stage.getBoundingClientRect(); fxx.clearRect(0,0,r.width,r.height);
  parts = parts.filter(p => p.life-- > 0 && p.y < r.height + 30);
  parts.forEach(p => { p.vy += .33; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
    fxx.save(); fxx.translate(p.x,p.y); fxx.rotate(p.a); fxx.globalAlpha = Math.min(1, p.life / 30);
    if (p.ring){ fxx.strokeStyle = p.c; fxx.lineWidth = 3; fxx.beginPath(); fxx.arc(0,0,p.s*.7,0,7); fxx.stroke(); } else { fxx.fillStyle = p.c; fxx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); }
    fxx.restore(); });
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRun = false; fxx.clearRect(0,0,r.width,r.height); }
}
const stagePoint = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

/* ---------- background bubbles that dodge the pointer ---------- */
const bg = $('#bg'), bgx = bg.getContext('2d'); let W = 0, H = 0, bubbles = [], ptr = {x:-999, y:-999};
function sizeBg(){ const r = sizeCanvas(bg); W = r.width; H = r.height; bubbles = Array.from({length: Math.round(W / 30)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*9+4, v:Math.random()*.4+.15, t:Math.random()*6, k:Math.random(), ox:0, oy:0})); }
sizeBg(); addEventListener('resize', () => { sizeBg(); timer.paint(); });
stage.addEventListener('pointermove', e => { [ptr.x, ptr.y] = stagePoint(e); });
stage.addEventListener('pointerleave', () => { ptr.x = ptr.y = -999; });
function bgLoop(){
  bgx.clearRect(0,0,W,H);
  bubbles.forEach(b => {
    if (!reduce){ b.y -= b.v; b.t += .02; }
    if (b.y < -20){ b.y = H + 20; b.x = Math.random()*W; }
    const bx = b.x + Math.sin(b.t)*12, dx = bx - ptr.x, dy = b.y - ptr.y, d = Math.hypot(dx, dy);
    if (d < 110){ b.ox += dx / d * 2.2; b.oy += dy / d * 2.2; }
    b.ox *= .93; b.oy *= .93;
    const X = bx + b.ox, Y = b.y + b.oy;
    if (b.k < .4){ bgx.fillStyle = 'rgba(31,123,224,.12)'; bgx.beginPath(); bgx.arc(X,Y,b.r*.8,0,7); bgx.fill(); }
    else if (b.k < .8){ bgx.fillStyle = 'rgba(232,51,127,.13)'; bgx.beginPath(); bgx.arc(X,Y,b.r,0,7); bgx.fill(); }
    else { bgx.save(); bgx.translate(X,Y); bgx.rotate(b.t); bgx.fillStyle = '#fff'; bgx.strokeStyle = 'rgba(232,51,127,.35)'; bgx.lineWidth = 1.5; bgx.fillRect(-b.r*.6,-b.r*.6,b.r*1.2,b.r*1.2); bgx.strokeRect(-b.r*.6,-b.r*.6,b.r*1.2,b.r*1.2); bgx.restore(); }
  });
  if (!reduce) requestAnimationFrame(bgLoop);
}

  let last = null, t = 0;
  const toSvg = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener('pointermove', e => { if (!hang) return; const p = toSvg(e); if (last){ const dx = p.x - last.x; hang.forEach(o => { if (Math.hypot(p.x - o.cx, p.y - o.cy) < 120) o.v += dx * .0009; }); } last = p; });
  svg.addEventListener('pointerleave', () => { last = null; });
  objs.forEach((el, i) => el.addEventListener('click', e => { const o = hang && hang[i]; if (!o) return; o.v += (Math.random() < .5 ? -1 : 1) * .09; const [x, y] = stagePoint(e); burst(x, y, 50); sfx.pop(); }));
  (function loop(){
    if (!hang) return; t += 1;
    hang.forEach(o => { o.v += -o.a * .0035 - o.v * .012 + (reduce ? 0 : Math.sin(t * .02 + o.ph) * .00012); o.a = Math.max(-.7, Math.min(.7, o.a + o.v));
      o.el.setAttribute('transform', `rotate(${(o.a * 57.3).toFixed(2)} ${o.px} -60)`); });
    hangRaf = requestAnimationFrame(loop);
  })();
}
function intro(){ timer.stop(); timer.reset();
  show('ميزان', `<div class="hang" aria-hidden="true">${HANG}</div>
    <h1 class="title"><span>صممت</span><span>للتوعية</span></h1>
    <p class="lead">لعبة تفاعلية يلعبها الحضور كفريق واحد: ٤ فئات و٤٠ سؤالاً عن السكري. حرّك المؤشر على المجسمات أو اضغط عليها.</p>
    <div class="row"><button class="btn pink" type="button" data-nav="menu">ابدأ اللعب ←</button><button class="ghost" type="button" data-nav="rules">قوانين اللعبة</button></div>
    <div class="himma-ink intro-logo" role="img" aria-label="نادي همة"></div>
    <a class="site-btn" href="https://mobhim.github.io/Himma/" target="_blank" rel="noopener">الموقع الرسمي <span dir="ltr">mobhim.github.io/Himma</span></a>`, 'intro');
  startHang();
}
function rules(){ timer.stop(); timer.reset();
  show('قوانين اللعبة', `<ol class="rules">${RULES.map((r,i) => `<li class="slide-in" style="animation-delay:${i*90}ms"><b>${ar(i+1)}</b><span>${r}</span></li>`).join('')}</ol>
    <p class="keys">اختصارات: <kbd>1</kbd>–<kbd>4</kbd> للإجابة · <kbd>Enter</kbd> للمتابعة · <kbd>Esc</kbd> للقائمة</p>
    <button class="btn pink" type="button" data-nav="menu">قائمة اللعبة ←</button>`, 'rules');
}
function menu(){ timer.stop(); timer.reset();
  show('قائمة اللعبة', `<div class="cats">${CAT_KEYS.map((k, i) => { const done = S.used[k].length, C = 2 * Math.PI * 34;
      return `<button class="cat pop-in tilt" type="button" data-cat="${k}" style="animation-delay:${i*80}ms">
      <span class="ring"><svg viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="34" fill="none" stroke="var(--paper-2)" stroke-width="5"/><circle cx="39" cy="39" r="34" fill="none" stroke="var(--pink)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - done / 10)}" transform="rotate(-90 39 39)" style="transition:stroke-dashoffset 1s"/></svg><span class="himma-ink rb" aria-hidden="true"></span></span>
      <span class="t">${CATS[k].t}</span><span class="c">${done}/10</span></button>`; }).join('')}</div>
    <button class="linkbtn" type="button" data-nav="end">إنهاء اللعبة وعرض النتيجة</button>`, 'menu');
}
function grid(k){ timer.stop(); timer.reset();
  S.cat = k;
  show(CATS[k].t, `<div class="grid" id="grid">${CATS[k].items.map((_, i) => `<button class="num pop-in" style="animation-delay:${i*45}ms" type="button" data-q="${i}" ${S.used[k].includes(i) ? 'disabled' : ''} aria-label="سؤال ${i+1}">${i+1}${ribbonMini}</button>`).join('')}</div>
    <button class="linkbtn" type="button" data-nav="menu">رجوع للقائمة</button>`, 'menu', 'grid');
  const g = $('#grid');
  g.addEventListener('pointermove', e => g.querySelectorAll('.num:not(:disabled)').forEach(b => { const r = b.getBoundingClientRect(), dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2), d = Math.hypot(dx, dy); b.style.translate = d < 110 ? `${dx*.22}px ${dy*.22}px` : '0 0'; }));
  g.addEventListener('pointerleave', () => g.querySelectorAll('.num').forEach(b => b.style.translate = '0 0'));
}
function question(k, i){
  S.cat = k; S.qi = i; S.done = false; S.attempt = '';
  const it = CATS[k].items[i];
  let card, side = '';
  if (k === 'word'){
    const letters = Array.from(it.w); let sc = shuffle(letters), tries = 0;
    while (sc.join('') === it.w && tries++ < 10) sc = shuffle(letters);
    card = `<div><div class="attempt" id="attempt" aria-live="polite"></div><div class="letters" id="letters">${sc.map((c, j) => `<button type="button" class="letter" data-l="${j}">${c}</button>`).join('')}</div><p class="hint">تلميح: ${it.h}<br>اضغطوا الحروف بالترتيب لتكوين الكلمة.</p></div>`;
  } else {
    card = `<p class="txt">${it.q}</p>`;
    const opts = k === 'mcq' ? it.o.map((o, j) => [['أ','ب','ج','د'][j] + ') ' + o, j]) : k === 'tf' ? [['صح', 1], ['خطأ', 0]] : [['حقيقة', 1], ['إشاعة', 0]];
    side = `<div class="opts">${opts.map(([t, v], j) => `<button class="opt" type="button" data-v="${v}"><kbd>${j+1}</kbd>${t}</button>`).join('')}</div>`;
  }
  show(CATS[k].t, `<div class="q">
      <div class="num" aria-hidden="true">${i+1}${ribbonMini}</div>
      <div class="qcard tilt" id="qcard"><svg class="rbg" viewBox="0 0 100 130" aria-hidden="true"><use href="#ribbonBlue"/></svg>${card}</div>
      ${side || '<div></div>'}
    </div>
    <div class="qfoot" id="qfoot"><button class="reveal" type="button" id="reveal" aria-label="إظهار الإجابة" title="إظهار الإجابة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button></div>`, 'menu', 'question');
  sBody.querySelectorAll('.opt').forEach(b => b.addEventListener('click', e => answer(+b.dataset.v, e)));
  sBody.querySelectorAll('.letter').forEach(b => b.addEventListener('click', () => pickLetter(b)));
  $('#reveal').addEventListener('click', () => reveal(null));
  timer.reset(); timer.start();
}
function pickLetter(b){
  if (S.done) return;
  const it = CATS[S.cat].items[S.qi];
  if (b.classList.contains('picked')){ return; }
  b.classList.add('picked'); sfx.click(); S.attempt += b.textContent; $('#attempt').textContent = S.attempt;
  if (Array.from(S.attempt).length === Array.from(it.w).length){
    if (S.attempt === it.w){ reveal(true); }
    else { const c = $('#qcard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); sfx.wrong();
      setTimeout(() => { if (S.done) return; S.attempt = ''; $('#attempt').textContent = ''; sBody.querySelectorAll('.letter').forEach(l => l.classList.remove('picked')); }, 600); }
  }
}
function correctValue(k, it){ return k === 'mcq' ? it.a : (it.a ? 1 : 0); }
function answer(v, e){ if (S.done) return; const it = CATS[S.cat].items[S.qi]; reveal(v === correctValue(S.cat, it), v, e); }
function reveal(ok, picked, e){
  if (S.done) return;
  S.done = true; timer.stop(); stage.classList.remove('alarm');
  const k = S.cat, it = CATS[k].items[S.qi];
  if (!S.used[k].includes(S.qi)) S.used[k].push(S.qi);
  const foot = $('#qfoot');
  if (k === 'word'){
    $('#letters').outerHTML = `<div class="answer-word pop-in">${it.w}</div>`;
    $('#attempt').textContent = '';
    if (ok === true){ score(true, e); foot.innerHTML = `<div class="explain anim"><b>أحسنتم! +١ نقطة للفريق</b>كوّنتم الكلمة الصحيحة.</div>`; foot.insertAdjacentHTML('beforeend', backBtn()); return; }
    foot.innerHTML = `<p class="hint">${timer.left <= 0 ? 'انتهى الوقت. ' : ''}هل عرف الفريق الكلمة؟</p><div class="judge"><button class="yes" type="button" data-j="1">نعم، +١ نقطة</button><button type="button" data-j="0">لا</button></div>`;
    foot.querySelectorAll('[data-j]').forEach(b => b.addEventListener('click', ev => { score(b.dataset.j === '1', ev); foot.innerHTML = `<div class="explain anim"><b>${b.dataset.j === '1' ? '+١ نقطة للفريق' : 'لا نقاط هذه المرة'}</b>الكلمة: ${it.w}</div>` + backBtn(); }));
    return;
  }
  const cv = correctValue(k, it);
  sBody.querySelectorAll('.opt').forEach(b => { b.disabled = true; const v = +b.dataset.v; if (v === cv) b.classList.add('right'); else if (v === picked) b.classList.add('wrong'); });
  const label = ok === true ? 'إجابة صحيحة! +١ نقطة للفريق' : ok === false ? 'إجابة خاطئة' : (timer.left <= 0 ? 'انتهى الوقت' : 'الإجابة الصحيحة');
  foot.innerHTML = `<div class="explain anim"><b class="${ok === true ? '' : 'timeout'}">${label}</b>${it.e}</div>` + backBtn();
  score(ok === true, e, ok === false || ok === null);
}
function score(ok, e, miss){
  if (ok){
    S.score++; S.streak++; S.best = Math.max(S.best, S.streak);
    const el = $('#score'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash');
    if (e && e.clientX){ const [x, y] = stagePoint(e); burst(x, y, 110); } else burst();
    sfx.right();
  } else {
    S.streak = 0; sfx.wrong();
    const c = $('#qcard'); if (c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  }
  paint();
  if (answeredCount() >= 40) $('#qfoot').insertAdjacentHTML('beforeend', `<button class="btn pink" type="button" data-nav="end">انتهت الأسئلة · عرض النتيجة</button>`);
}
const backBtn = () => `<button class="back" type="button" data-cat="${S.cat}" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>رجوع للأسئلة</button>`;
function end(){ timer.stop(); timer.reset();
  const a = S.score, n = answeredCount(), pct = n ? a / n : 0;
  const head = !n ? 'ابدأوا بأول سؤال' : pct >= .85 ? 'فريق خبير في السكري!' : pct >= .6 ? 'أداء رائع يا فريق' : 'بداية جيدة، والمعرفة تكبر مع كل سؤال';
  show('النتيجة', `<div class="end">
    <div class="logo-hero" id="endLogo" title="اضغط للاحتفال"><svg viewBox="0 0 100 130" aria-hidden="true"><use href="#ribbonBlue"/></svg></div>
    <h2>${head}</h2>
    <div class="final"><div class="pop-in"><strong style="color:var(--pink)">${ar(a)}</strong>إجابة صحيحة</div><div class="pop-in" style="animation-delay:.15s"><strong style="color:var(--circle)">${ar(n)}</strong>سؤال مُجاب</div><div class="pop-in" style="animation-delay:.3s"><strong>${n ? ar(Math.round(pct*100)) + '٪' : '—'}</strong>الدقة</div><div class="pop-in" style="animation-delay:.45s"><strong style="color:var(--pink-deep)">${ar(S.best)}</strong>أطول سلسلة</div></div>
    <div><div class="big14">١٤ نوفمبر</div><p class="lead">اليوم العالمي للسكري · افحص سكرك، وشارك ما تعلمته اليوم.</p></div>
    <div class="row"><button class="ghost" type="button" id="reset">لعبة جديدة</button><button class="btn pink" type="button" data-nav="menu">متابعة الأسئلة</button></div>
    <div class="himma-ink sm" role="img" aria-label="نادي همة"></div></div>`, 'end');
  if (n){ burst(); setTimeout(() => burst(), 450); sfx.win(); }
  $('#endLogo').addEventListener('click', e => { const [x, y] = stagePoint(e); burst(x, y, 120); sfx.right(); });
  $('#reset').addEventListener('click', () => { S.used = {mcq:[],tf:[],word:[],rumor:[]}; S.score = 0; S.streak = 0; S.best = 0; paint(); menu(); });
}

/* ---------- tilt ---------- */
stage.addEventListener('pointermove', e => {
  const t = e.target.closest('.tilt'); if (!t || reduce) return;
  const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  t.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
});
stage.addEventListener('pointerout', e => { const t = e.target.closest('.tilt'); if (t && !t.contains(e.relatedTarget)) t.style.transform = ''; });

const timer = {left:1, running:false, start(){}, stop(){}, reset(){}, paint(){}};

/* ---------- input ---------- */
const VIEWS = {intro, rules, menu, end};
document.addEventListener('click', e => {
  if (e.target.closest('button')) sfx.click();
  const n = e.target.closest('[data-nav]'); if (n){ VIEWS[n.dataset.nav](); return; }
  const c = e.target.closest('[data-cat]'); if (c){ grid(c.dataset.cat); return; }
  const q = e.target.closest('[data-q]'); if (q && !q.disabled && S.view === 'grid'){ question(S.cat, +q.dataset.q); return; }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'Escape'){ menu(); return; }
  if (e.key === 'Enter'){ const b = $('#backBtn') || (S.view === 'intro' ? sBody.querySelector('[data-nav="menu"]') : null); if (b){ e.preventDefault(); b.click(); } return; }
  if (S.view === 'question' && /^[1-4]$/.test(e.key)){ const o = sBody.querySelectorAll('.opt')[+e.key - 1]; if (o && !o.disabled){ const r = o.getBoundingClientRect(); answer(+o.dataset.v, {clientX: r.left + r.width/2, clientY: r.top + r.height/2}); } }
});

document.querySelectorAll('[data-himma]').forEach(i => i.src = HIMMA);
paint(); intro();
})();
</script>
